name: CI/CD SAGRES

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Build e validação do Backend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verificar versão do Java
        run: java -version

      - name: Compilar e validar Backend
        run: mvn -B -f backend/pom.xml clean verify -DskipTests

  frontend:
    name: Teste e build do Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar testes
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand

      - name: Gerar build de produção
        working-directory: frontend
        env:
          CI: true
        run: npm run build

      - name: Validar arquivos gerados
        working-directory: frontend
        run: test -f build/index.html

  deploy-staging:
    name: Deploy no ambiente Staging
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Deploy Backend no Staging
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_BACKEND_HOOK"

      - name: Deploy Frontend no Staging
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_FRONTEND_HOOK"

  smoke-test-staging:
    name: Teste dinâmico do Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Verificar Backend
        env:
          STAGING_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
        run: |
          curl --fail --show-error --silent \
            --retry 20 \
            --retry-delay 10 \
            --retry-all-errors \
            "$STAGING_BACKEND_URL/api/usuarios/"

      - name: Verificar Frontend
        env:
          STAGING_FRONTEND_URL: ${{ secrets.STAGING_FRONTEND_URL }}
        run: |
          curl --fail --show-error --silent \
            --retry 20 \
            --retry-delay 10 \
            --retry-all-errors \
            "$STAGING_FRONTEND_URL"

  deploy-production:
    name: Deploy no ambiente Production
    needs: smoke-test-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy Backend em Produção
        env:
          RENDER_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_BACKEND_HOOK"

      - name: Deploy Frontend em Produção
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_FRONTEND_HOOK"
